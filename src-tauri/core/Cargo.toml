[package]
name = "maverick-core"
version = "0.1.0"
description = "Maverick — Tauri-free core (pty, remote protocol/server, sidecar client)"
authors = ["Malhar Ujawane"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "maverick_core"

# All deps inherit pins/features from the workspace root's
# [workspace.dependencies] table (src-tauri/Cargo.toml) — single source of truth.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }
portable-pty = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
snow = { workspace = true }
mdns-sd = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
curve25519-dalek = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
tempfile = "3"
# tokio `test-util` enables the paused-clock (`time::advance`, `start_paused`)
# the hook-bridge permission-timeout test relies on for deterministic timing.
tokio = { version = "1", features = ["full", "test-util"] }
