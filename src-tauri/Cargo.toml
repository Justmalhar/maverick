[workspace]
members = [".", "core", "hostd"]
resolver = "2"

# Single source of truth for dependency versions/features shared between the
# workspace members (maverick desktop + maverick-core, and soon maverick-hostd).
# Members opt in via `dep = { workspace = true }`; shared feature flags live here
# so a version bump happens in exactly one place and members cannot drift.
# Tauri-specific deps (tauri, tauri-plugin-*, tauri-build) are intentionally NOT
# here — they belong to the desktop crate only and must never leak into core/hostd.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
anyhow = "1"
thiserror = "2"
dashmap = "6"
once_cell = "1"
which = "6"
dirs = "5"
portable-pty = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
# snow's feature set is load-bearing (see core/Cargo.toml rationale): only the
# exact Noise_XX_25519_ChaChaPoly_SHA256 cipher-suite the RN client uses is
# enabled, std intentionally OFF to keep ring/blake2 out of the graph.
snow = { version = "0.10", default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-sha2",
    "use-getrandom",
] }
mdns-sd = "0.13"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
curve25519-dalek = "4"
subtle = "2"

[package]
name = "maverick"
version = "0.1.0"
description = "Maverick — AI IDE Orchestrator"
authors = ["Malhar Ujawane"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "maverick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri-free core: PTY management, the companion remote protocol + server, and
# the sidecar JSON-RPC client. Shared with the headless daemon (maverick-hostd).
maverick-core = { path = "core" }
# `unstable` enables embedded child webviews (Window::add_child) used by the Browser panel.
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Auto-update plumbing (P3-B). The plugin compiles and registers unconditionally;
# signature verification only runs at runtime against a real signed release, so a
# placeholder pubkey in tauri.conf.json keeps dev/CI builds green while never
# silently accepting an unsigned update (an empty/invalid pubkey just fails the
# check, it does not bypass verification).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
# Shared deps inherit pins/features from [workspace.dependencies]. Only those the
# desktop crate's own src/ references directly are declared here; everything else
# the desktop binary needs (pty, remote protocol/server, sidecar client, the whole
# Noise/mDNS pairing stack) reaches it transitively through `maverick-core`.
#   serde       — #[derive(Serialize/Deserialize)] across command DTOs
#   serde_json  — serde_json::{json, Value} in commands/lib
#   which       — which::which() in backend_detector
#   dirs        — dirs::home_dir() in lib/backend_detector
#   log         — log::{warn,error,info} macros + tauri-plugin-log wiring
# Dropped (no direct use under src-tauri/src; verified via grep, transitive via
# maverick-core): anyhow, thiserror, dashmap, once_cell, portable-pty, base64,
# uuid, chrono, tokio-tungstenite, futures-util, async-trait, snow, mdns-sd, sha2,
# getrandom, hex, curve25519-dalek, subtle. tokio is dropped from runtime deps too
# (only #[tokio::test] is used, covered by dev-dependencies below).
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `test` enables tauri::test::mock_app for exercising commands headlessly.
tauri = { version = "2", features = ["test"] }
# `test-util` enables tokio's paused-clock (`time::advance`, `start_paused`) so
# the hook-bridge permission-timeout test asserts the 30 s auto-deny in virtual
# time, deterministically and instantly (no real 30 s wait). Dev/test only.
tokio = { version = "1", features = ["full", "test-util"] }
